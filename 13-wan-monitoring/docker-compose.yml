services:
  loki:
    image: grafana/loki:2.9.8
    container_name: wan-loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  wan-probe:
    build: ./probe
    container_name: wan-probe
    environment:
      - GATEWAY=192.168.2.1
      - INTERVAL=30
    volumes:
      - ./logs:/var/log/wan-probe
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: wan-promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ./logs:/var/log/wan-probe:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: wan-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
