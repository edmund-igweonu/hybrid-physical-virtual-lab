#  /etc/rsyslog.conf  -- log collector for the hybrid-physical-virtual-lab
#  Listens for syslog from the 2950 and the FRR nodes, writes each source
#  to its own file under /var/log/remote/ so Promtail can label by host.

module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")

# Don't also log remote messages into the local system log files
$RepeatedMsgReduction on

# Template: one file per remote hostname/IP
$template RemoteLogs,"/var/log/remote/%HOSTNAME%.log"

# Anything NOT originating on this container itself goes to the template.
# (local messages, if any, keep going to the default rsyslog outputs below)
if $fromhost-ip != '127.0.0.1' then {
    action(type="omfile" dynaFile="RemoteLogs")
    stop
}

# Local/default logging (container's own messages, if ever needed)
*.*     /var/log/syslog
