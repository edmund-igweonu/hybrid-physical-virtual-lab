# datasource.yaml
# Use the stock grafana/grafana image as the GNS3 Docker node and mount
# this file to /etc/grafana/provisioning/datasources/datasource.yaml
# so Loki shows up as a data source automatically on first boot -
# no manual click-through in the Grafana UI needed.

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    # loki-node's hostname does NOT resolve (no DNS between GNS3
    # Docker nodes) - must be the actual assigned IP, kept in sync
    # with loki-node's entrypoint.sh NODE_IP default.
    url: http://10.10.30.242:3100
    isDefault: true
    editable: true
